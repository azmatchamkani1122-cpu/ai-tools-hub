
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Writer - AI Tools Hub</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background: #050f1c;
      border-bottom: 1px solid #1c3048;
    }

    .brand {
      color: #38d9c3 !important;
      font-size: 24px;
      font-weight: bold;
    }

    .writer-section {
      padding: 70px 15px;
      min-height: calc(100vh - 70px);
      background:
        radial-gradient(circle at center, rgba(56,217,195,0.13), transparent 40%);
    }

    .writer-box {
      max-width: 1000px;
      margin: auto;
      background: #0d1b2d;
      border: 1px solid #1d3149;
      border-radius: 22px;
      padding: 35px;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title h1 {
      font-size: 45px;
      font-weight: 800;
    }

    .title h1 span {
      color: #38d9c3;
    }

    .title p {
      color: #94a6ba;
    }

    label {
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea,
    select {
      background: #101f33 !important;
      color: white !important;
      border: 1px solid #263b54 !important;
      border-radius: 12px !important;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    textarea:focus,
    select:focus {
      border-color: #38d9c3 !important;
      box-shadow: 0 0 0 3px rgba(56,217,195,0.12) !important;
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #38d9c3;
      color: #06121f;
      font-size: 17px;
      font-weight: bold;
    }

    .generate-btn:hover {
      background: white;
    }

    .result-box {
      margin-top: 30px;
      padding: 25px;
      background: #081525;
      border: 1px solid #1d3149;
      border-radius: 15px;
      min-height: 180px;
      white-space: pre-wrap;
      line-height: 1.7;
      color: #dce7f2;
    }

    .copy-btn {
      margin-top: 15px;
      padding: 10px 18px;
      border: 1px solid #38d9c3;
      background: transparent;
      color: #38d9c3;
      border-radius: 10px;
      display: none;
    }

    .copy-btn:hover {
      background: #38d9c3;
      color: #06121f;
    }

    .loading {
      color: #38d9c3;
    }

    @media (max-width: 600px) {
      .writer-box {
        padding: 22px;
      }

      .title h1 {
        font-size: 35px;
      }
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark">
  <div class="container">

    <a class="navbar-brand brand" href="index.html">
      🤖 AI Tools Hub
    </a>

    <a href="index.html" class="btn btn-outline-light">
      Home
    </a>

  </div>
</nav>


<section class="writer-section">

  <div class="writer-box">

    <div class="title">
      <h1>✍️ AI <span>Writer</span></h1>

      <p>
        Create professional content with the power of AI.
      </p>
    </div>


    <div class="mb-4">

      <label for="contentType">
        What do you want to write?
      </label>

      <select id="contentType" class="form-select">

        <option>Blog Article</option>
        <option>Website Content</option>
        <option>Social Media Post</option>
        <option>Product Description</option>
        <option>Email</option>
        <option>Advertisement</option>
        <option>Professional Introduction</option>

      </select>

    </div>


    <div class="mb-3">

      <label for="userPrompt">
        Describe what you want
      </label>

      <textarea
        id="userPrompt"
        class="form-control"
        placeholder="Example: Write a professional introduction for my AI Tools Hub website..."
      ></textarea>

    </div>


    <button
      class="generate-btn"
      onclick="generateContent()">

      ✨ Generate with AI

    </button>


    <div id="result" class="result-box">
      Your AI-generated content will appear here...
    </div>


    <button
      id="copyBtn"
      class="copy-btn"
      onclick="copyResult()">

      📋 Copy Content

    </button>

  </div>

</section>


<script>

async function generateContent() {

  const prompt =
    document.getElementById("userPrompt").value.trim();

  const contentType =
    document.getElementById("contentType").value;

  const result =
    document.getElementById("result");

  const copyBtn =
    document.getElementById("copyBtn");


  if (!prompt) {

    result.innerHTML =
      "⚠️ Please describe what you want me to write.";

    copyBtn.style.display = "none";

    return;
  }


  result.innerHTML =
    '<span class="loading">🤖 AI is writing...</span>';

  copyBtn.style.display = "none";


  const finalPrompt = `
You are a professional AI writing assistant.

Write a high-quality ${contentType}.

User request:
${prompt}

Requirements:
- Make the content professional.
- Make it clear and useful.
- Use natural language.
- Do not mention that you are an AI.
- Give only the requested content.
`;


  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: finalPrompt
      })

    });


    const data = await response.json();


    if (!response.ok) {

      result.innerHTML =
        "❌ Gemini Error: " +
        (data.error || "Something went wrong.");

      return;
    }


    if (!data.reply) {

      result.innerHTML =
        "❌ AI response nahi mila.";

      return;
    }


    result.textContent = data.reply;

    copyBtn.style.display = "inline-block";


  } catch (error) {

    result.innerHTML =
      "❌ Server se connection nahi ho raha.";

  }

}


function copyResult() {

  const result =
    document.getElementById("result");

  navigator.clipboard.writeText(result.innerText);

  const copyBtn =
    document.getElementById("copyBtn");

  copyBtn.innerText = "✅ Copied!";

  setTimeout(() => {

    copyBtn.innerText = "📋 Copy Content";

  }, 2000);

}

</script>

</body>
</html>
