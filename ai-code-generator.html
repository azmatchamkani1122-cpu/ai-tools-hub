<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Code Generator - AI Tools Hub</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>

    body {
      margin: 0;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background: #050f1c;
      border-bottom: 1px solid #1c3048;
      padding: 18px 0;
    }

    .brand {
      color: #38d9c3 !important;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    .code-section {
      min-height: calc(100vh - 75px);
      padding: 70px 15px;

      background:
        radial-gradient(
          circle at center,
          rgba(56,217,195,0.13),
          transparent 42%
        );
    }

    .code-box {
      max-width: 1100px;
      margin: auto;

      background: #0d1b2d;
      border: 1px solid #1d3149;
      border-radius: 22px;

      padding: 35px;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title h1 {
      font-size: 45px;
      font-weight: 800;
    }

    .title h1 span {
      color: #38d9c3;
    }

    .title p {
      color: #94a6ba;
      line-height: 1.6;
    }

    label {
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 190px;

      background: #101f33 !important;
      color: white !important;

      border: 1px solid #263b54 !important;
      border-radius: 12px !important;

      padding: 15px;
      resize: vertical;
    }

    textarea::placeholder {
      color: #71849a;
    }

    textarea:focus {
      border-color: #38d9c3 !important;

      box-shadow:
        0 0 0 3px rgba(56,217,195,0.12) !important;
    }

    .generate-btn {
      width: 100%;

      padding: 14px;
      margin-top: 20px;

      border: none;
      border-radius: 12px;

      background: #38d9c3;
      color: #06121f;

      font-size: 17px;
      font-weight: bold;

      transition: 0.3s;
    }

    .generate-btn:hover {
      background: white;
    }

    .result-area {
      margin-top: 30px;
    }

    .code-container {
      position: relative;
    }

    pre {
      margin: 0;

      min-height: 300px;

      background: #050b14;

      border: 1px solid #1d3149;
      border-radius: 15px;

      padding: 25px;

      color: #dce7f2;

      white-space: pre-wrap;
      word-break: break-word;

      line-height: 1.6;

      overflow-x: auto;
    }

    .copy-btn {
      display: none;

      margin-top: 15px;

      padding: 10px 18px;

      border: 1px solid #38d9c3;

      background: transparent;

      color: #38d9c3;

      border-radius: 10px;
    }

    .copy-btn:hover {
      background: #38d9c3;
      color: #06121f;
    }

    .loading {
      color: #38d9c3;
    }

    @media (max-width: 600px) {

      .code-box {
        padding: 22px;
      }

      .title h1 {
        font-size: 35px;
      }

    }

  </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark">

  <div class="container">

    <a
      class="navbar-brand brand"
      href="index.html">

      🤖 AI Tools Hub

    </a>

    <a
      href="index.html"
      class="btn btn-outline-light">

      Home

    </a>

  </div>

</nav>



<!-- CODE GENERATOR -->

<section class="code-section">

  <div class="code-box">


    <div class="title">

      <h1>
        💻 AI <span>Code Generator</span>
      </h1>

      <p>
        Describe what you want to build and let AI
        generate the code for you.
      </p>

    </div>



    <div>

      <label for="codePrompt">
        What code do you want?
      </label>

      <textarea
        id="codePrompt"
        placeholder="Example: Create a responsive login page using HTML, CSS and Bootstrap..."></textarea>

    </div>



    <button
      class="generate-btn"
      onclick="generateCode()">

      💻 Generate Code with AI

    </button>



    <div class="result-area">

      <label>
        Generated Code
      </label>

      <div class="code-container">

        <pre id="result">Your generated code will appear here...</pre>

      </div>


      <button
        id="copyBtn"
        class="copy-btn"
        onclick="copyCode()">

        📋 Copy Code

      </button>

    </div>


  </div>

</section>



<script>


async function generateCode() {

  const prompt =
    document
      .getElementById("codePrompt")
      .value
      .trim();


  const result =
    document
      .getElementById("result");


  const copyBtn =
    document
      .getElementById("copyBtn");


  if (!prompt) {

    result.textContent =
      "⚠️ Please describe the code you want.";

    copyBtn.style.display = "none";

    return;

  }


  result.innerHTML =
    '<span class="loading">🤖 AI is generating code...</span>';

  copyBtn.style.display = "none";


  const finalPrompt = `

You are a professional software developer.

Generate the code requested by the user.

User request:
${prompt}

Requirements:

- Provide complete working code.
- Make the code clean and professional.
- Use modern best practices.
- If HTML is requested, provide complete HTML.
- If Bootstrap is requested, use Bootstrap 5.
- Do not explain the code unless necessary.
- Return only the code.
- Do not use markdown code fences.

`;


  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message: finalPrompt

        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      result.textContent =
        "❌ Gemini Error: " +
        (data.error ||
        "Something went wrong.");

      return;

    }


    if (!data.reply) {

      result.textContent =
        "❌ AI response nahi mila.";

      return;

    }


    result.textContent =
      data.reply;


    copyBtn.style.display =
      "inline-block";


  } catch (error) {

    result.textContent =
      "❌ Server se connection nahi ho raha.";

  }

}



function copyCode() {

  const result =
    document
      .getElementById("result");


  navigator.clipboard.writeText(
    result.innerText
  );


  const copyBtn =
    document
      .getElementById("copyBtn");


  copyBtn.innerText =
    "✅ Copied!";


  setTimeout(function() {

    copyBtn.innerText =
      "📋 Copy Code";

  }, 2000);

}


</script>


</body>

</html>
