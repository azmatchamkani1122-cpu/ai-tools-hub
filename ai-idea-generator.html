<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Idea Generator - AI Tools Hub</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>

    body {
      margin: 0;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background: #050f1c;
      border-bottom: 1px solid #1c3048;
      padding: 18px 0;
    }

    .brand {
      color: #38d9c3 !important;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    .idea-section {
      min-height: calc(100vh - 75px);
      padding: 70px 15px;

      background:
        radial-gradient(
          circle at center,
          rgba(56,217,195,0.13),
          transparent 42%
        );
    }

    .idea-box {
      max-width: 1050px;
      margin: auto;

      background: #0d1b2d;
      border: 1px solid #1d3149;
      border-radius: 22px;

      padding: 35px;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title h1 {
      font-size: 45px;
      font-weight: 800;
    }

    .title h1 span {
      color: #38d9c3;
    }

    .title p {
      color: #94a6ba;
      line-height: 1.6;
    }

    label {
      font-weight: bold;
      margin-bottom: 10px;
    }

    select,
    textarea {
      background: #101f33 !important;
      color: white !important;

      border: 1px solid #263b54 !important;
      border-radius: 12px !important;
    }

    select:focus,
    textarea:focus {
      border-color: #38d9c3 !important;

      box-shadow:
        0 0 0 3px rgba(56,217,195,0.12) !important;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      padding: 15px;
    }

    textarea::placeholder {
      color: #71849a;
    }

    .generate-btn {
      width: 100%;

      padding: 14px;
      margin-top: 20px;

      border: none;
      border-radius: 12px;

      background: #38d9c3;
      color: #06121f;

      font-size: 17px;
      font-weight: bold;

      transition: 0.3s;
    }

    .generate-btn:hover {
      background: white;
    }

    .result-box {
      margin-top: 30px;

      padding: 25px;

      background: #081525;

      border: 1px solid #1d3149;
      border-radius: 15px;

      min-height: 250px;

      color: #dce7f2;

      line-height: 1.8;

      white-space: pre-wrap;
    }

    .copy-btn {
      display: none;

      margin-top: 15px;

      padding: 10px 18px;

      border: 1px solid #38d9c3;

      background: transparent;

      color: #38d9c3;

      border-radius: 10px;
    }

    .copy-btn:hover {
      background: #38d9c3;
      color: #06121f;
    }

    .loading {
      color: #38d9c3;
    }

    @media (max-width: 600px) {

      .idea-box {
        padding: 22px;
      }

      .title h1 {
        font-size: 35px;
      }

    }

  </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark">

  <div class="container">

    <a
      class="navbar-brand brand"
      href="index.html">

      🤖 AI Tools Hub

    </a>

    <a
      href="index.html"
      class="btn btn-outline-light">

      Home

    </a>

  </div>

</nav>



<!-- IDEA GENERATOR -->

<section class="idea-section">

  <div class="idea-box">


    <div class="title">

      <h1>
        💡 AI <span>Idea Generator</span>
      </h1>

      <p>
        Generate creative and useful ideas with
        the power of artificial intelligence.
      </p>

    </div>



    <div class="mb-4">

      <label for="ideaType">
        What type of ideas do you need?
      </label>

      <select
        id="ideaType"
        class="form-select">

        <option>Website Ideas</option>
        <option>Business Ideas</option>
        <option>App Ideas</option>
        <option>YouTube Channel Ideas</option>
        <option>Blog Ideas</option>
        <option>Content Ideas</option>
        <option>Startup Ideas</option>
        <option>Student Project Ideas</option>
        <option>Marketing Ideas</option>

      </select>

    </div>



    <div>

      <label for="ideaPrompt">
        Describe your requirements
      </label>

      <textarea
        id="ideaPrompt"
        placeholder="Example: Give me creative website ideas for students that could attract visitors..."></textarea>

    </div>



    <button
      class="generate-btn"
      onclick="generateIdeas()">

      💡 Generate Ideas with AI

    </button>



    <div
      id="result"
      class="result-box">

      Your AI-generated ideas will appear here...

    </div>



    <button
      id="copyBtn"
      class="copy-btn"
      onclick="copyIdeas()">

      📋 Copy Ideas

    </button>


  </div>

</section>



<script>


async function generateIdeas() {

  const prompt =
    document
      .getElementById("ideaPrompt")
      .value
      .trim();


  const ideaType =
    document
      .getElementById("ideaType")
      .value;


  const result =
    document
      .getElementById("result");


  const copyBtn =
    document
      .getElementById("copyBtn");


  if (!prompt) {

    result.textContent =
      "⚠️ Please describe what kind of ideas you need.";

    copyBtn.style.display = "none";

    return;

  }


  result.innerHTML =
    '<span class="loading">🤖 AI is creating ideas...</span>';

  copyBtn.style.display = "none";


  const finalPrompt = `

You are a professional creative idea generation assistant.

Generate useful and creative ${ideaType}.

User requirements:
${prompt}

Requirements:

- Give 10 unique ideas.
- Give each idea a clear title.
- Give a short description for each idea.
- Make the ideas practical and useful.
- Avoid repeating the same idea.
- Make the ideas suitable for the user's requirements.
- Use clear formatting.
- Do not mention that you are an AI.

Return only the generated ideas.

`;


  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message: finalPrompt

        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      result.textContent =
        "❌ Gemini Error: " +
        (data.error ||
        "Something went wrong.");

      return;

    }


    if (!data.reply) {

      result.textContent =
        "❌ AI response nahi mila.";

      return;

    }


    result.textContent =
      data.reply;


    copyBtn.style.display =
      "inline-block";


  } catch (error) {

    result.textContent =
      "❌ Server se connection nahi ho raha.";

  }

}



function copyIdeas() {

  const result =
    document
      .getElementById("result");


  navigator.clipboard.writeText(
    result.innerText
  );


  const copyBtn =
    document
      .getElementById("copyBtn");


  copyBtn.innerText =
    "✅ Copied!";


  setTimeout(function() {

    copyBtn.innerText =
      "📋 Copy Ideas";

  }, 2000);

}


</script>


</body>

</html>
