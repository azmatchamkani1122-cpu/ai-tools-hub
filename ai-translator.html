<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Translator - AI Tools Hub</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>

    body {
      margin: 0;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background: #050f1c;
      border-bottom: 1px solid #1c3048;
      padding: 18px 0;
    }

    .brand {
      color: #38d9c3 !important;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    .translator-section {
      min-height: calc(100vh - 75px);
      padding: 70px 15px;

      background:
        radial-gradient(
          circle at center,
          rgba(56,217,195,0.13),
          transparent 42%
        );
    }

    .translator-box {
      max-width: 1050px;
      margin: auto;

      background: #0d1b2d;
      border: 1px solid #1d3149;
      border-radius: 22px;

      padding: 35px;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title h1 {
      font-size: 45px;
      font-weight: 800;
    }

    .title h1 span {
      color: #38d9c3;
    }

    .title p {
      color: #94a6ba;
      line-height: 1.6;
    }

    label {
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea,
    select {
      background: #101f33 !important;
      color: white !important;

      border: 1px solid #263b54 !important;
      border-radius: 12px !important;
    }

    textarea {
      min-height: 230px;
      resize: vertical;
      padding: 15px;
    }

    textarea::placeholder {
      color: #71849a;
    }

    textarea:focus,
    select:focus {
      border-color: #38d9c3 !important;

      box-shadow:
        0 0 0 3px rgba(56,217,195,0.12) !important;
    }

    .translate-btn {
      width: 100%;

      padding: 14px;
      margin-top: 20px;

      border: none;
      border-radius: 12px;

      background: #38d9c3;
      color: #06121f;

      font-size: 17px;
      font-weight: bold;

      transition: 0.3s;
    }

    .translate-btn:hover {
      background: white;
    }

    .result-box {
      margin-top: 30px;

      padding: 25px;

      background: #081525;

      border: 1px solid #1d3149;
      border-radius: 15px;

      min-height: 230px;

      color: #dce7f2;

      line-height: 1.7;

      white-space: pre-wrap;
    }

    .loading {
      color: #38d9c3;
    }

    .copy-btn {
      display: none;

      margin-top: 15px;

      padding: 10px 18px;

      border: 1px solid #38d9c3;

      background: transparent;

      color: #38d9c3;

      border-radius: 10px;
    }

    .copy-btn:hover {
      background: #38d9c3;
      color: #06121f;
    }

    @media (max-width: 600px) {

      .translator-box {
        padding: 22px;
      }

      .title h1 {
        font-size: 35px;
      }

    }

  </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark">

  <div class="container">

    <a
      class="navbar-brand brand"
      href="index.html">

      🤖 AI Tools Hub

    </a>

    <a
      href="index.html"
      class="btn btn-outline-light">

      Home

    </a>

  </div>

</nav>



<!-- TRANSLATOR -->

<section class="translator-section">

  <div class="translator-box">


    <div class="title">

      <h1>
        🌐 AI <span>Translator</span>
      </h1>

      <p>
        Translate your text quickly and naturally
        with artificial intelligence.
      </p>

    </div>



    <div class="row g-4">


      <!-- SOURCE LANGUAGE -->

      <div class="col-md-6">

        <label for="sourceLanguage">
          Translate From
        </label>

        <select
          id="sourceLanguage"
          class="form-select">

          <option>Auto Detect</option>
          <option>English</option>
          <option>Urdu</option>
          <option>Arabic</option>
          <option>Pashto</option>
          <option>Hindi</option>
          <option>French</option>
          <option>German</option>
          <option>Spanish</option>
          <option>Chinese</option>
          <option>Japanese</option>

        </select>

      </div>



      <!-- TARGET LANGUAGE -->

      <div class="col-md-6">

        <label for="targetLanguage">
          Translate To
        </label>

        <select
          id="targetLanguage"
          class="form-select">

          <option>English</option>
          <option>Urdu</option>
          <option>Pashto</option>
          <option>Arabic</option>
          <option>Hindi</option>
          <option>French</option>
          <option>German</option>
          <option>Spanish</option>
          <option>Chinese</option>
          <option>Japanese</option>

        </select>

      </div>


    </div>



    <div class="mt-4">

      <label for="inputText">
        Enter Text
      </label>

      <textarea
        id="inputText"
        class="form-control"
        placeholder="Type or paste the text you want to translate..."></textarea>

    </div>



    <button
      class="translate-btn"
      onclick="translateText()">

      🌐 Translate with AI

    </button>



    <div
      id="result"
      class="result-box">

      Your translated text will appear here...

    </div>



    <button
      id="copyBtn"
      class="copy-btn"
      onclick="copyTranslation()">

      📋 Copy Translation

    </button>


  </div>

</section>



<script>


async function translateText() {

  const input =
    document
      .getElementById("inputText")
      .value
      .trim();


  const sourceLanguage =
    document
      .getElementById("sourceLanguage")
      .value;


  const targetLanguage =
    document
      .getElementById("targetLanguage")
      .value;


  const result =
    document
      .getElementById("result");


  const copyBtn =
    document
      .getElementById("copyBtn");


  if (!input) {

    result.innerHTML =
      "⚠️ Please enter some text first.";

    copyBtn.style.display = "none";

    return;

  }


  if (targetLanguage === "Auto Detect") {

    result.innerHTML =
      "⚠️ Please select a target language.";

    copyBtn.style.display = "none";

    return;

  }


  result.innerHTML =
    '<span class="loading">🤖 AI is translating...</span>';

  copyBtn.style.display = "none";


  const prompt = `

You are a professional translation assistant.

Translate the following text from ${sourceLanguage}
to ${targetLanguage}.

Requirements:

- Preserve the original meaning.
- Use natural and fluent language.
- Do not add explanations.
- Do not remove important information.
- Return only the translated text.

TEXT:

${input}

`;


  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message: prompt

        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      result.innerHTML =
        "❌ Gemini Error: " +
        (data.error ||
        "Something went wrong.");

      return;

    }


    if (!data.reply) {

      result.innerHTML =
        "❌ AI response nahi mila.";

      return;

    }


    result.textContent =
      data.reply;


    copyBtn.style.display =
      "inline-block";


  } catch (error) {

    result.innerHTML =
      "❌ Server se connection nahi ho raha.";

  }

}



function copyTranslation() {

  const result =
    document
      .getElementById("result");


  navigator.clipboard.writeText(
    result.innerText
  );


  const copyBtn =
    document
      .getElementById("copyBtn");


  copyBtn.innerText =
    "✅ Copied!";


  setTimeout(function() {

    copyBtn.innerText =
      "📋 Copy Translation";

  }, 2000);

}


</script>


</body>

</html>
