<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Summarizer - AI Tools Hub</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>

    body {
      margin: 0;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background: #050f1c;
      border-bottom: 1px solid #1c3048;
      padding: 18px 0;
    }

    .brand {
      color: #38d9c3 !important;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    .summarizer-section {
      min-height: calc(100vh - 75px);
      padding: 70px 15px;

      background:
        radial-gradient(
          circle at center,
          rgba(56,217,195,0.13),
          transparent 42%
        );
    }

    .summarizer-box {
      max-width: 1000px;
      margin: auto;

      background: #0d1b2d;
      border: 1px solid #1d3149;
      border-radius: 22px;

      padding: 35px;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title h1 {
      font-size: 45px;
      font-weight: 800;
    }

    .title h1 span {
      color: #38d9c3;
    }

    .title p {
      color: #94a6ba;
      line-height: 1.6;
    }

    label {
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 260px;

      background: #101f33 !important;
      color: white !important;

      border: 1px solid #263b54 !important;
      border-radius: 12px !important;

      padding: 15px;
      resize: vertical;
    }

    textarea::placeholder {
      color: #71849a;
    }

    textarea:focus {
      border-color: #38d9c3 !important;

      box-shadow:
        0 0 0 3px rgba(56,217,195,0.12) !important;
    }

    .summarize-btn {
      width: 100%;

      padding: 14px;
      margin-top: 20px;

      border: none;
      border-radius: 12px;

      background: #38d9c3;
      color: #06121f;

      font-size: 17px;
      font-weight: bold;

      transition: 0.3s;
    }

    .summarize-btn:hover {
      background: white;
    }

    .result-box {
      margin-top: 30px;

      padding: 25px;

      background: #081525;

      border: 1px solid #1d3149;
      border-radius: 15px;

      min-height: 200px;

      color: #dce7f2;

      line-height: 1.7;

      white-space: pre-wrap;
    }

    .loading {
      color: #38d9c3;
    }

    .copy-btn {
      display: none;

      margin-top: 15px;

      padding: 10px 18px;

      border: 1px solid #38d9c3;

      background: transparent;

      color: #38d9c3;

      border-radius: 10px;
    }

    .copy-btn:hover {
      background: #38d9c3;
      color: #06121f;
    }

    @media (max-width: 600px) {

      .summarizer-box {
        padding: 22px;
      }

      .title h1 {
        font-size: 35px;
      }

    }

  </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark">

  <div class="container">

    <a
      class="navbar-brand brand"
      href="index.html">

      🤖 AI Tools Hub

    </a>


    <a
      href="index.html"
      class="btn btn-outline-light">

      Home

    </a>

  </div>

</nav>



<!-- SUMMARIZER -->

<section class="summarizer-section">

  <div class="summarizer-box">


    <div class="title">

      <h1>
        📄 AI <span>Summarizer</span>
      </h1>

      <p>
        Paste your text and let AI turn it into
        a clear and useful summary.
      </p>

    </div>



    <div>

      <label for="inputText">
        Enter your text
      </label>

      <textarea
        id="inputText"
        placeholder="Paste your article, notes, document or any long text here...">
      </textarea>

    </div>



    <button
      class="summarize-btn"
      onclick="summarizeText()">

      ✨ Summarize with AI

    </button>



    <div
      id="result"
      class="result-box">

      Your AI summary will appear here...

    </div>



    <button
      id="copyBtn"
      class="copy-btn"
      onclick="copySummary()">

      📋 Copy Summary

    </button>


  </div>

</section>



<script>


async function summarizeText() {

  const input =
    document
      .getElementById("inputText")
      .value
      .trim();


  const result =
    document
      .getElementById("result");


  const copyBtn =
    document
      .getElementById("copyBtn");


  if (!input) {

    result.innerHTML =
      "⚠️ Please paste some text first.";

    copyBtn.style.display = "none";

    return;

  }


  result.innerHTML =
    '<span class="loading">🤖 AI is summarizing...</span>';

  copyBtn.style.display = "none";


  const prompt = `

You are a professional AI summarization assistant.

Summarize the following text clearly and accurately.

Requirements:

- Keep the most important information.
- Remove unnecessary repetition.
- Make the summary easy to understand.
- Keep important facts and key points.
- Use clear paragraphs or bullet points when useful.
- Do not add information that is not present in the original text.

TEXT TO SUMMARIZE:

${input}

`;


  try {


    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message: prompt

        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      result.innerHTML =
        "❌ Gemini Error: " +
        (data.error ||
        "Something went wrong.");

      return;

    }


    if (!data.reply) {

      result.innerHTML =
        "❌ AI response nahi mila.";

      return;

    }


    result.textContent =
      data.reply;


    copyBtn.style.display =
      "inline-block";


  } catch (error) {


    result.innerHTML =
      "❌ Server se connection nahi ho raha.";


  }

}



function copySummary() {

  const result =
    document
      .getElementById("result");


  navigator.clipboard.writeText(
    result.innerText
  );


  const copyBtn =
    document
      .getElementById("copyBtn");


  copyBtn.innerText =
    "✅ Copied!";


  setTimeout(function() {

    copyBtn.innerText =
      "📋 Copy Summary";

  }, 2000);

}


</script>


</body>

</html>
